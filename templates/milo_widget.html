<style>
  #milo-float-button {
    position: fixed;
    right: 25px;
    bottom: 25px;
    width: 62px;
    height: 62px;
    border-radius: 50%;
    border: 2px solid #00e5ff;
    background: linear-gradient(135deg, #07101f, #0b2633);
    color: #00e5ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    cursor: pointer;
    z-index: 99999;
    box-shadow:
      0 0 12px rgba(0, 229, 255, 0.55),
      0 0 30px rgba(0, 229, 255, 0.25);
    animation: miloFloat 2.5s ease-in-out infinite;
    transition: 0.3s ease;
  }

  #milo-float-button:hover {
    transform: scale(1.12);
    box-shadow:
      0 0 18px rgba(0, 229, 255, 0.8),
      0 0 40px rgba(0, 229, 255, 0.4);
  }

  @keyframes miloFloat {
    0%,
    100% {
      transform: translateY(0);
    }

    50% {
      transform: translateY(-7px);
    }
  }

  #milo-chat-window {
    position: fixed;
    right: 25px;
    bottom: 100px;
    width: 360px;
    max-width: calc(100vw - 30px);
    height: 500px;
    background: #081020;
    border: 1px solid #00e5ff;
    border-radius: 18px;
    z-index: 99998;
    display: none;
    flex-direction: column;
    overflow: hidden;
    box-shadow:
      0 0 20px rgba(0, 229, 255, 0.35),
      0 0 60px rgba(0, 229, 255, 0.12);
  }

  #milo-chat-window.milo-open {
    display: flex;
    animation: miloOpen 0.25s ease;
  }

  @keyframes miloOpen {
    from {
      opacity: 0;
      transform: translateY(15px) scale(0.96);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .milo-header {
    min-height: 68px;
    padding: 12px 15px;
    background: #0c1428;
    border-bottom: 1px solid #19364a;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .milo-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .milo-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #07101f;
    border: 1px solid #00e5ff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 21px;
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
  }

  .milo-name {
    color: #ffffff;
    font-weight: bold;
    font-size: 15px;
  }

  .milo-status {
    color: #00ff9d;
    font-size: 11px;
    margin-top: 3px;
  }

  .milo-close {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: #111b31;
    color: #9aa8bd;
    cursor: pointer;
    font-size: 18px;
  }

  .milo-close:hover {
    color: #ffffff;
    background: #19364a;
  }

  .milo-chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #050816;
  }

  .milo-chat-message {
    max-width: 88%;
    padding: 10px 13px;
    margin-bottom: 10px;
    border-radius: 11px;
    font-size: 13px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .milo-chat-bot {
    background: #111b31;
    border-left: 3px solid #00e5ff;
    color: #d8dfeb;
  }

  .milo-chat-user {
    margin-left: auto;
    background: #0b2633;
    border-right: 3px solid #00ff9d;
    color: #ffffff;
  }

  .milo-typing {
    display: none;
    color: #00e5ff;
    font-size: 12px;
    padding: 0 15px 8px;
  }

  .milo-input-area {
    padding: 12px;
    background: #0c1428;
    border-top: 1px solid #19364a;
    display: flex;
    gap: 8px;
  }

  .milo-input {
    flex: 1;
    min-width: 0;
    padding: 11px 12px;
    border-radius: 9px;
    border: 1px solid #19364a;
    background: #07101f;
    color: #ffffff;
    outline: none;
    font-size: 13px;
  }

  .milo-input:focus {
    border-color: #00e5ff;
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.15);
  }

  .milo-send {
    width: 45px;
    border: none;
    border-radius: 9px;
    background: #00e5ff;
    color: #031018;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
  }

  .milo-send:hover {
    opacity: 0.85;
  }

  @media (max-width: 500px) {
    #milo-float-button {
      right: 15px;
      bottom: 15px;
      width: 56px;
      height: 56px;
    }

    #milo-chat-window {
      right: 10px;
      bottom: 82px;
      width: calc(100vw - 20px);
      height: 70vh;
    }
  }
</style>

<!-- FLOATING MILO BUTTON -->

<button
  id="milo-float-button"
  type="button"
  aria-label="Open Milo"
  onclick="toggleMilo()"
>
  🤖
</button>

<!-- MILO CHAT WINDOW -->

<div id="milo-chat-window">
  <div class="milo-header">
    <div class="milo-header-left">
      <div class="milo-avatar">🤖</div>

      <div>
        <div class="milo-name">Milo</div>

        <div class="milo-status">● Job & Internship Assistant</div>
      </div>
    </div>

    <button
      class="milo-close"
      type="button"
      onclick="toggleMilo()"
      aria-label="Close Milo"
    >
      ×
    </button>
  </div>

  <div id="miloChatMessages" class="milo-chat-messages">
    <div class="milo-chat-message milo-chat-bot">
      Hi! I'm Milo 🤖 Ask me about jobs, internships, companies, hiring,
      applications, salary, skills, or your resume match.
    </div>
  </div>

  <div id="miloTyping" class="milo-typing">
    Milo is checking your resume analysis...
  </div>

  <div class="milo-input-area">
    <input
      id="miloChatInput"
      class="milo-input"
      type="text"
      placeholder="Ask about a job or internship..."
      autocomplete="off"
    />

    <button class="milo-send" type="button" onclick="sendFloatingMiloMessage()">
      ➤
    </button>
  </div>
</div>

<script>
  function toggleMilo() {
    const chat = document.getElementById("milo-chat-window");

    chat.classList.toggle("milo-open");

    if (chat.classList.contains("milo-open")) {
      setTimeout(function () {
        document.getElementById("miloChatInput").focus();
      }, 200);
    }
  }

  function addMiloMessage(message, type) {
    const container = document.getElementById("miloChatMessages");

    const messageElement = document.createElement("div");

    messageElement.className =
      "milo-chat-message " +
      (type === "user" ? "milo-chat-user" : "milo-chat-bot");

    messageElement.textContent = message;

    container.appendChild(messageElement);

    container.scrollTop = container.scrollHeight;
  }

  async function sendFloatingMiloMessage() {
    const input = document.getElementById("miloChatInput");

    const typing = document.getElementById("miloTyping");

    const message = input.value.trim();

    if (!message) {
      return;
    }

    addMiloMessage(message, "user");

    input.value = "";

    typing.style.display = "block";

    const formData = new FormData();

    formData.append("message", message);

    /*
      These values are supplied by result.html
      when resume analysis data is available.
    */

    if (typeof miloRecommendations !== "undefined") {
      formData.append(
        "recommendations_data",
        JSON.stringify(miloRecommendations),
      );
    }

    if (typeof miloPrediction !== "undefined") {
      formData.append("prediction_data", JSON.stringify(miloPrediction));
    }

    if (typeof miloSkills !== "undefined") {
      formData.append("skills_data", JSON.stringify(miloSkills));
    }

    if (typeof miloATSScore !== "undefined") {
      formData.append("ats_score", String(miloATSScore));
    }

    try {
      const response = await fetch("/milo", {
        method: "POST",
        body: formData,
      });

      const data = await response.json();

      if (data.success) {
        addMiloMessage(data.response, "bot");
      } else {
        addMiloMessage(
          data.response || "Milo could not process your question.",
          "bot",
        );
      }
    } catch (error) {
      console.error("Milo error:", error);

      addMiloMessage(
        "Milo could not connect to the server. Please try again.",
        "bot",
      );
    }

    typing.style.display = "none";
  }

  document.addEventListener("DOMContentLoaded", function () {
    const input = document.getElementById("miloChatInput");

    if (!input) {
      return;
    }

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();

        sendFloatingMiloMessage();
      }
    });
  });
</script>
